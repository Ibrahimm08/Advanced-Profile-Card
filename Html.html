<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Style.css" />
    <script src="Scripts.js"></script>
</head>

<body>
    <div class="card-container" >
        <div class="card" id="card" >
            <div class="card back">
                <p onclick="Flip()">Back Side</p>
            </div>
            <div class="card front">
                <h1 onclick="Flip()">Get in touch</h1>
                <p>Complete the form bellow and I will get back to you as soon as i can</p>
                <form action="" class="front-form">

                    <div class="Firstname">
                        <label for="Firstname">First Name*</label>
                        <input type="text" name="Firstname" required>
                    </div>

                    <div class="Lastname">
                        <label for="Lastname">Last Name*</label>
                        <input type="text" name="Lastname" required>
                    </div>

                    <div class="Email">
                        <label for="Email">Email*</label>
                        <input type="email" name="Email" id="">
                    </div>

                    <div class="Message">
                        <label for="Message">Message*</label>
                        <textarea name="Message" minlength="50" maxlength="500"></textarea>
                        <label for="Message" class="notice">min 50 characters, max 500 characters</label>
                    </div>

                    <div class="Bottom">
                        <input type="checkbox" name="Accept" required>
                        <label for="Accept" class="Policy">Please accept our Privacy Policy*</label>
                        <button type="submit" class="submit">SUBMIT</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
